<!doctype html>
<html lang="en" class="theme-light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <title>Artify Solutions | Adaptive Software. Intelligent Ecosystems. Built Around Your Business.</title>
    <meta name="description" content="Artify Solutions provides fully customized, adaptive enterprise software ecosystems enhanced by next-generation AI. Your software should adapt to your business — not your business adapt to the software." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://artifysols.com/" />

    <meta property="og:title" content="Artify Solutions | Adaptive Software. Intelligent Ecosystems. Built Around Your Business." />
    <meta property="og:description" content="Your software should adapt to your business — not your business adapt to software. Fully customized, adaptive enterprise solutions enhanced by next-generation AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://artifysols.com/" />
    <meta property="og:site_name" content="Artify Solutions" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://artifysols.com/og-banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Artify Solutions | AI-Native Software & Intelligent Automation" />
    <meta name="twitter:description" content="Your Business. Reimagined by AI. We engineer intelligent software systems that understand your business, automate processes, and connect your data." />
    <meta name="twitter:image" content="https://artifysols.com/og-banner.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://artifysols.com/#organization",
            "name": "Artify Solutions",
            "url": "https://artifysols.com/",
            "logo": "https://artifysols.com/logo.png",
            "description": "Artify Solutions builds AI-native software, autonomous agent swarms, business automation and fully customized digital solutions designed around your organization's unique workflows."
          },
          {
            "@type": "WebSite",
            "@id": "https://artifysols.com/#website",
            "url": "https://artifysols.com/",
            "name": "Artify Solutions",
            "publisher": { "@id": "https://artifysols.com/#organization" }
          }
        ]
      }
    </script>

    <!--hero-critical-css-->
    <!-- Hero image: discoverable from the HTML so it downloads in parallel with the app code -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      href="/hero-devices.webp"
      imagesrcset="/hero-devices-800.webp 800w, /hero-devices.webp 1633w"
      imagesizes="(max-width: 1023px) 100vw, 44vw"
    />

    <!-- Fonts are self-hosted: they arrive in parallel with the first paint, so the hero text does not re-wrap when they load -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-500.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-600.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-700.woff2" />
    <!-- the four preloaded faces the hero uses are display:block so the text appears directly in its final font (no re-wrap); the rest swap -->
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 400; font-display: block; src: url('/fonts/plus-jakarta-sans-400.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 500; font-display: block; src: url('/fonts/plus-jakarta-sans-500.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 600; font-display: block; src: url('/fonts/plus-jakarta-sans-600.woff2') format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 700; font-display: block; src: url('/fonts/plus-jakarta-sans-700.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/jetbrains-mono-400.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/jetbrains-mono-500.woff2') format('woff2'); }
    </style>

    <!-- Fallback font styling to ensure immediate text paint -->
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 selection:bg-[#7C3AED]/30 selection:text-[#EDE9FE] antialiased overflow-x-hidden">
    <div id="root"><!--hero-shell:start--><!--hero-shell:end--></div>
    <script>
      /* Pick the saved theme before first paint so the prerendered hero never flashes the wrong one. */
      try {
        if (localStorage.getItem('artify_theme') === 'dark') {
          var de = document.documentElement, bd = document.body;
          de.classList.replace('theme-light', 'theme-dark');
          var sh = document.querySelector('[data-hero-shell]');
          if (sh) {
            sh.classList.remove('theme-light', 'bg-[#F8FAFC]', 'text-slate-900');
            sh.classList.add('theme-dark', 'bg-[#050505]', 'text-[#F5F5F5]');
          }
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
